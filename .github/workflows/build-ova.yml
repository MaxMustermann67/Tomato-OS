name: Build Tomato OS OVA

on:
  push:
    branches: [main, feature/bootable-ova]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends debootstrap parted qemu-utils grub-pc-bin grub2-common e2fsprogs qemu-system-x86
      - name: Check source syntax
        run: |
          bash -n scripts/build-ova.sh guest/configure.sh
          sh -n guest/tomato-desktop-init.sh
          python3 -m py_compile scripts/make-ovf.py guest/firstboot.py guest/finish-setup.py
      - name: Build bootable appliance
        run: |
          sudo bash scripts/build-ova.sh
          sudo chown -R "$USER:$USER" dist
      - name: Validate package
        run: |
          qemu-img info dist/Tomato-OS-disk1.vmdk
          tar -tf dist/Tomato-OS.ova
          cd dist
          sha256sum -c Tomato-OS.ova.sha256
      - name: Boot smoke test with QEMU
        run: |
          set -e
          qemu-system-x86_64 -m 2048 -accel tcg -snapshot -display none \
            -serial file:dist/serial.log -monitor none \
            -drive file=dist/Tomato-OS-disk1.vmdk,if=ide,format=vmdk \
            -netdev user,id=net0 -device e1000,netdev=net0 \
            >dist/qemu.log 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if grep -q 'tomato-os login:' dist/serial.log; then
              echo "Tomato OS reached a login prompt."
              exit 0
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              cat dist/qemu.log
              exit 1
            fi
            sleep 5
          done
          tail -100 dist/serial.log
          exit 1
      - name: Add Windows installer
        run: cp windows/Tomato-OS-installieren.cmd dist/
      - name: Upload OVA
        uses: actions/upload-artifact@v4
        with:
          name: Tomato-OS-OVA
          path: |
            dist/Tomato-OS.ova
            dist/Tomato-OS.ova.sha256
            dist/Tomato-OS-installieren.cmd
          retention-days: 14